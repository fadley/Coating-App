<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coating App">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f14">
  <title>Coating Process App</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e8eef7;
      --text-muted: #8b9cb3;
      --accent-twas: #3b82f6;
      --accent-plasma: #8b5cf6;
      --accent-green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0f14; color: var(--text); }
    .screen { display: none; padding: 16px; max-width: 640px; margin: 0 auto; }
    .screen.active { display: block; }
    .type-card { background: #1a2332; border: 2px solid; border-radius: 18px; padding: 22px; margin-bottom: 16px; }
    .type-card.twas { border-color: #3b82f6; }
    .type-card.plasma { border-color: #8b5cf6; }
    .type-card.ecp { border-color: #10b981; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; color: white; margin-bottom: 8px; }
    .twas .badge { background: #3b82f6; }
    .plasma .badge { background: #8b5cf6; }
    .ecp .badge { background: #10b981; }
    .btn { border: none; border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #243044; color: white; }
    .btn-success { background: #10b981; color: white; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .back-btn { background: #1a2332; border: 1px solid #2d3a4f; color: white; width: 40px; height: 40px; border-radius: 10px; }
    .part-card { background: #161d29; border: 1px solid #2d3a4f; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .param-item { background: #161d29; border: 1px solid #2d3a4f; border-radius: 12px; padding: 10px; }
    .form-group { margin-bottom: 12px; }
    .form-group input { width: 100%; background: #1a2332; border: 1px solid #2d3a4f; border-radius: 10px; padding: 12px; color: white; }
    .section-title { font-weight: 700; margin: 16px 0 8px; }
  </style>
</head>
<body>
  <div id="screen-landing" class="screen active">
    <h1 style="text-align:center; margin-bottom:24px;">Coating Process</h1>
    <div class="type-card twas" onclick="openParts('TWAS')">
      <div class="badge">TWAS</div>
      <h2>Twin Arc Spray</h2>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" onclick="event.stopPropagation(); openParts('TWAS')">Parts</button>
        <button class="btn btn-secondary" onclick="event.stopPropagation(); openMaintenance('TWAS')">Maintenance</button>
      </div>
    </div>
    <div class="type-card plasma" onclick="openParts('PLASMA')">
      <div class="badge">PLASMA</div>
      <h2>Plasma Coating</h2>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" onclick="event.stopPropagation(); openParts('PLASMA')">Parts</button>
        <button class="btn btn-secondary" onclick="event.stopPropagation(); openMaintenance('PLASMA')">Maintenance</button>
      </div>
    </div>
    <div class="type-card ecp" onclick="openParts('ECP')">
      <div class="badge">ECP</div>
      <h2>ECP</h2>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" style="background:#10b981" onclick="event.stopPropagation(); openParts('ECP')">Parts</button>
        <button class="btn btn-secondary" onclick="event.stopPropagation(); openMaintenance('ECP')">Maintenance</button>
      </div>
    </div>
  </div>

  <div id="screen-parts" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('landing')">⌂</button>
      <div style="flex:1"><h1>Parts</h1><div id="parts-subtitle" style="color:#8b9cb3;font-size:0.85rem;"></div></div>
      <button class="btn btn-success" onclick="openAddPart()">+ Part</button>
    </div>
    <input type="search" id="search-input" placeholder="Search..." oninput="filterParts()" style="width:100%;background:#1a2332;border:1px solid #2d3a4f;border-radius:10px;padding:12px;color:white;margin-bottom:12px;">
    <div id="part-list"></div>
  </div>

  <div id="screen-add-part" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('parts')">←</button>
      <h1 id="add-part-title">Add Part</h1>
    </div>
    <div class="form-group"><label>Part Name *</label><input id="new-part-name"></div>
    <div class="form-group"><label>Part # *</label><input id="new-part-number"></div>
    <div class="form-group"><label>Client</label><input id="new-part-client"></div>
    <div class="form-group"><label>PRG #</label><input id="new-part-prg"></div>
    <div class="form-group"><label>Program</label><input id="new-part-program"></div>
    <div class="form-group"><label>Fixture</label><input id="new-part-fixture"></div>
    <div class="form-group"><label>Water Pressure</label><input id="new-part-water"></div>
    <button class="btn btn-success" style="width:100%;margin-top:12px;" onclick="saveNewPart()">Save Part</button>
  </div>

  <div id="screen-part-detail" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('parts')">←</button>
      <div style="flex:1"><h1 id="detail-name"></h1><div id="detail-number" style="color:#8b9cb3;"></div></div>
      <button class="btn btn-secondary" onclick="openEditPart()">Info</button>
      <button class="btn btn-secondary" onclick="toggleEditMode()">Steps</button>
    </div>
    <div class="param-grid" id="param-grid"></div>
    <div id="fixtures-section"></div>
    <div class="section-title">Process Steps</div>
    <div id="steps-edit-bar" style="display:none;margin-bottom:10px;"><button class="btn btn-success" onclick="addStep()">+ Add Step</button></div>
    <div id="steps-list"></div>
  </div>

  <script>
    let data = { TWAS: {parts:[], maintenance:[]}, PLASMA: {parts:[], maintenance:[]}, ECP: {parts:[], maintenance:[]} };
    let currentType = "TWAS";
    let currentPartId = null;
    let editMode = false;
    let editingPartId = null;

    function loadData() {
      const saved = localStorage.getItem("coatingAppData");
      if (saved) { try { data = JSON.parse(saved); } catch(e) {} }
      if (!data.ECP) data.ECP = {parts:[], maintenance:[]};
      if (!data.TWAS) data.TWAS = {parts:[], maintenance:[]};
      if (!data.PLASMA) data.PLASMA = {parts:[], maintenance:[]};
    }
    function saveData() { localStorage.setItem("coatingAppData", JSON.stringify(data)); }
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-" + id).classList.add("active");
    }
    function openParts(type) {
      currentType = type;
      document.getElementById("parts-subtitle").textContent = type === "TWAS" ? "Twin Arc Spray" : type === "PLASMA" ? "Plasma Coating" : "ECP";
      renderParts();
      showScreen("parts");
    }
    function renderParts() {
      const list = document.getElementById("part-list");
      const parts = data[currentType].parts || [];
      if (!parts.length) { list.innerHTML = '<div style="text-align:center;color:#8b9cb3;padding:30px;">No parts yet</div>'; return; }
      list.innerHTML = parts.map(p => `
        <div class="part-card" onclick="openPart('${p.id}')">
          <strong>${p.partName || ""}</strong>
          <div style="font-size:0.8rem;color:#8b9cb3;">${p.partNumber || ""} · ${p.client || ""}</div>
        </div>
      `).join("");
    }
    function filterParts() {
      const q = document.getElementById("search-input").value.toLowerCase();
      document.querySelectorAll(".part-card").forEach(c => {
        c.style.display = c.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }
    function openAddPart() {
      editingPartId = null;
      document.getElementById("add-part-title").textContent = "Add Part";
      ["name","number","client","prg","program","fixture","water"].forEach(id => document.getElementById("new-part-"+id).value = "");
      showScreen("add-part");
    }
    function openEditPart() {
      const part = data[currentType].parts.find(p => p.id === currentPartId);
      if (!part) return;
      editingPartId = part.id;
      document.getElementById("add-part-title").textContent = "Edit Part";
      document.getElementById("new-part-name").value = part.partName || "";
      document.getElementById("new-part-number").value = part.partNumber || "";
      document.getElementById("new-part-client").value = part.client || "";
      document.getElementById("new-part-prg").value = part.prg || "";
      document.getElementById("new-part-program").value = part.program || "";
      document.getElementById("new-part-fixture").value = (part.fixtures||[]).map(f => f.name || f).join(" | ");
      document.getElementById("new-part-water").value = part.waterPressure || "";
      showScreen("add-part");
    }
    function saveNewPart() {
      const name = document.getElementById("new-part-name").value.trim();
      const number = document.getElementById("new-part-number").value.trim();
      if (!name || !number) { alert("Name and Part # required"); return; }
      const fixtures = document.getElementById("new-part-fixture").value.split("|").map(s => ({name: s.trim(), image: null})).filter(f => f.name);
      const water = document.getElementById("new-part-water").value.trim();
      if (editingPartId) {
        const part = data[currentType].parts.find(p => p.id === editingPartId);
        Object.assign(part, { partName: name, partNumber: number, client: document.getElementById("new-part-client").value.trim(), prg: document.getElementById("new-part-prg").value.trim(), program: document.getElementById("new-part-program").value.trim(), fixtures, waterPressure: water });
      } else {
        data[currentType].parts.unshift({ id: Date.now().toString(), partName: name, partNumber: number, client: document.getElementById("new-part-client").value.trim(), prg: document.getElementById("new-part-prg").value.trim(), program: document.getElementById("new-part-program").value.trim(), fixtures, waterPressure: water, steps: [] });
      }
      saveData();
      openParts(currentType);
    }
    function openPart(id) {
      currentPartId = id;
      editMode = false;
      const part = data[currentType].parts.find(p => p.id === id);
      if (!part) return;
      document.getElementById("detail-name").textContent = part.partName;
      document.getElementById("detail-number").textContent = part.partNumber;
      document.getElementById("param-grid").innerHTML = `
        <div class="param-item"><label>Client</label><div>${part.client||""}</div></div>
        <div class="param-item"><label>PRG #</label><div>${part.prg||""}</div></div>
        <div class="param-item" style="grid-column:1/-1"><label>Program</label><div>${part.program||""}</div></div>
        <div class="param-item" style="grid-column:1/-1"><label>Water Pressure</label><div>${part.waterPressure||""}</div></div>
      `;
      document.getElementById("steps-edit-bar").style.display = "none";
      renderSteps(part);
      showScreen("part-detail");
    }
    function renderSteps(part) {
      const list = document.getElementById("steps-list");
      if (!part.steps || !part.steps.length) { list.innerHTML = '<div style="color:#8b9cb3;text-align:center;padding:20px;">No steps yet</div>'; return; }
      list.innerHTML = part.steps.map((s,i) => `<div style="background:#1a2332;border:1px solid #2d3a4f;border-radius:10px;padding:12px;margin-bottom:8px;"><strong>${i+1}. ${s.title}</strong><div style="color:#8b9cb3;margin-top:4px;">${s.body}</div></div>`).join("");
    }
    function toggleEditMode() {
      editMode = !editMode;
      document.getElementById("steps-edit-bar").style.display = editMode ? "block" : "none";
    }
    function addStep() { alert("Step editing is available in the full version. Use the downloaded file for complete features."); }
    function openMaintenance(type) { alert("Maintenance for " + type); }
    loadData();
  </script>
</body>
</html>
